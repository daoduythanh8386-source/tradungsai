name: Build EXE & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài thư viện
        run: npm install
        env:
          CI: false

      - name: Build .exe
        run: npm run build:exe
        env:
          CI: false

      - name: Lưu tệp .exe
        uses: actions/upload-artifact@v4
        with:
          name: TraDungSai-Setup-Windows
          path: dist/*.exe

  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài thư viện
        run: npm install
        env:
          CI: false

      - name: Cập nhật Capacitor
        run: |
          npx cap init "TraDungSai" com.tradungsai.app --web-dir=www --force || true
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Lưu tệp .apk
        uses: actions/upload-artifact@v4
        with:
          name: TraDungSai-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
